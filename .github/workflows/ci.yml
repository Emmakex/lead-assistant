name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.0', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint PHP
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' -print0)

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find public -type f -name '*.js' -print0)

  repository-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard against committed secrets and vertical coupling
        shell: bash
        run: |
          set -euo pipefail

          if grep -RInE --exclude-dir=.git '(sk-[A-Za-z0-9_-]{20,}|OPENAI_API_KEY[[:space:]]*=)' lead-assistant.php includes public 2>/dev/null; then
            echo 'Potential API credential committed to executable plugin code.' >&2
            exit 1
          fi

          if grep -RInE '(^|[^[:alnum:]_])(SmartFinance|smartfinance|mortgage|hipoteca|TIN|TAE)([^[:alnum:]_]|$)' lead-assistant.php includes public --include='*.php' --include='*.js' --include='*.css' 2>/dev/null; then
            echo 'Vertical-specific SmartFinance/mortgage coupling found in core code.' >&2
            exit 1
          fi
